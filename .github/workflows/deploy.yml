name: Publier sur GitHub Pages

# Publie l'application (fichiers statiques seulement : aucune donnée d'utilisateur) à chaque
# fusion dans main, ou à la demande depuis l'onglet Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # L'adresse est https://<compte>.github.io/<dépôt>/ : l'application doit le savoir.
      - run: npm run build
        env:
          KOLO_BASE: /${{ github.event.repository.name }}/
      # GitHub Pages ne connaît pas les adresses de l'application : 404.html renvoie vers elle.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploiement
        uses: actions/deploy-pages@v4
